[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mosquito-mapper-backend"
version = "0.8.0"
description = "MosquitoMapper v2.2 backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11.3,<13",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "reportlab>=4.4,<5",
  "shapely>=2.1,<3",
  "sqlalchemy>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
  "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=./data/pytest-tmp"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: tests using SQLite and local storage",
  "contract: HTTP and OpenAPI contract tests",
  "e2e: full workflow tests",
  "external: tests requiring a real external provider",
]

[tool.coverage.run]
branch = true
source = ["app"]
